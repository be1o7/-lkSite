<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berkay Yılmaz — Portfolyo</title>
  
  <!-- CSS Dosyası Bağlantısı -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Lucide İkon Kütüphanesi -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Arka Plan Işık Efektleri -->
  <div id="ambient-glow" class="mouse-glow"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- ANA İÇERİK -->
  <main class="container">
    
    <!-- Profil / Hero Alanı -->
    <header class="hero">
      <div class="profile-wrapper">
        <div class="profile-glow"></div>
        <img src="manifestyaa.JPEG" alt="Berkay Yılmaz" class="profile-img">
      </div>

      <div class="status-badge">
        <span class="status-dot"></span>
        Geliştirici & Bilişim Öğrencisi
      </div>
      
      <h1 class="title">Berkay Yılmaz</h1>
      <p class="subtitle">Donanım, yazılım ve yapay zeka araçlarıyla dijital deneyimler inşa ediyorum.</p>
    </header>

    <!-- Menü Kartları (Bento Grid) -->
    <section class="grid">
      
      <!-- Hakkımda -->
      <button onclick="openModal('about')" class="card">
        <div class="card-left">
          <div class="icon-box">
            <i data-lucide="user"></i>
          </div>
          <div class="card-text">
            <h2>Hakkımda</h2>
            <p>Vizyonum ve çalışma tutkum</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="arrow-icon"></i>
      </button>

      <!-- Yetenekler -->
      <button onclick="openModal('skills')" class="card">
        <div class="card-left">
          <div class="icon-box">
            <i data-lucide="cpu"></i>
          </div>
          <div class="card-text">
            <h2>Yetenekler & İlgi Alanları</h2>
            <p>Yazılım, PC donanımı & AI</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="arrow-icon"></i>
      </button>

      <!-- Eğitim -->
      <button onclick="openModal('school')" class="card">
        <div class="card-left">
          <div class="icon-box">
            <i data-lucide="graduation-cap"></i>
          </div>
          <div class="card-text">
            <h2>Eğitim</h2>
            <p>11. Sınıf Bilişim Teknolojileri</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="arrow-icon"></i>
      </button>

      <!-- İletişim -->
      <button onclick="openModal('contact')" class="card">
        <div class="card-left">
          <div class="icon-box">
            <i data-lucide="phone"></i>
          </div>
          <div class="card-text">
            <h2>İletişim</h2>
            <p>Doğrudan bağlantı kurun</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="arrow-icon"></i>
      </button>

    </section>
  </main>

  <!-- MODAL PENCRERESİ -->
  <div id="modal-overlay" class="modal-overlay">
    <div id="modal-card" class="modal-card">
      <button onclick="closeModal()" class="close-btn">
        <i data-lucide="x"></i>
      </button>

      <div class="modal-header">
        <div id="modal-icon-wrapper" class="modal-icon"></div>
        <h2 id="modal-title"></h2>
      </div>

      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- TOAST BİLDİRİMİ -->
  <div id="toast" class="toast">
    <i data-lucide="check-circle-2"></i>
    <span>Telefon numarası kopyalandı!</span>
  </div>

  <script>
    lucide.createIcons();

    const contentData = {
      about: {
        title: "Hakkımda",
        icon: "user",
        body: `
          <p style="margin-bottom: 12px;">
            Merhaba! Ben <strong>Berkay Yılmaz</strong>. Teknolojinin mutfağında olmayı, sistem mimarilerini anlamayı ve yeni nesil yazılım yöntemleriyle üretmeyi seven bir bilişim tutkunuyum.
          </p>
          <p>
            Yalnızca kod yazmakla kalmıyor; bilgisayar donanımlarının sınırlarını zorlamaktan, yapay zeka entegrasyonlu modern geliştirme süreçlerine (Vibe Coding) kadar geniş bir alanda kendimi sürekli geliştiriyorum.
          </p>
        `
      },
      skills: {
        title: "Yetenekler & İlgi Alanları",
        icon: "cpu",
        body: `
          <div class="modal-block-list">
            <div class="info-block">
              <h3>Yazılım & Kodlama</h3>
              <p>Yazılım prensipleri, algoritmalar ve proje geliştirme süreçleri.</p>
            </div>
            <div class="info-block">
              <h3>Donanım & PC Sistemleri</h3>
              <p>Üst düzey masaüstü PC donanımları, performans optimizasyonu ve sistem bileşenleri.</p>
            </div>
            <div class="info-block">
              <h3>Vibe Coding & Claude Code</h3>
              <p>Yoğun Claude Code kullanımı ve yapay zeka destekli hızlı, pürüzsüz kodlama akışı.</p>
            </div>
          </div>
        `
      },
      school: {
        title: "Eğitim",
        icon: "graduation-cap",
        body: `
          <div class="info-block highlight">
            <span class="tag">Mevcut Durum</span>
            <h3>11. Sınıf Bilişim Teknolojileri</h3>
            <p>
              Bilişim Teknolojileri alanında lise eğitimime devam etmekteyim. Okul müfredatını kişisel yazılım projelerim, yapay zeka araçları ve donanım tecrübemle harmanlayarak geleceğe hazırlanıyorum.
            </p>
          </div>
        `
      },
      contact: {
        title: "İletişim",
        icon: "phone",
        body: `
          <p style="margin-bottom: 16px; color: rgba(255, 255, 255, 0.6);">
            Benimle iletişime geçmek, projeler üzerine konuşmak veya soru sormak için aşağıdaki kanalı kullanabilirsiniz:
          </p>
          <div onclick="copyPhone('+90 541 355 1927')" class="contact-box">
            <div class="contact-inner">
              <div class="contact-icon"><i data-lucide="phone-call"></i></div>
              <div>
                <span class="contact-label">Telefon / WhatsApp</span>
                <span class="contact-val">+90 541 355 1927</span>
              </div>
            </div>
            <i data-lucide="copy" class="copy-icon"></i>
          </div>
        `
      }
    };

    // Mouse Hareketiyle Parlama Efekti
    window.addEventListener('mousemove', (e) => {
      const glow = document.getElementById('ambient-glow');
      glow.style.setProperty('--mouse-x', `${e.clientX}px`);
      glow.style.setProperty('--mouse-y', `${e.clientY}px`);
      glow.style.opacity = '1';
    });

    function openModal(id) {
      const data = contentData[id];
      if (!data) return;

      document.getElementById('modal-title').innerText = data.title;
      document.getElementById('modal-body').innerHTML = data.body;
      
      const iconWrapper = document.getElementById('modal-icon-wrapper');
      iconWrapper.innerHTML = `<i data-lucide="${data.icon}"></i>`;

      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');

      overlay.classList.add('active');
      card.classList.add('active');

      lucide.createIcons();
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');

      card.classList.remove('active');
      setTimeout(() => {
        overlay.classList.remove('active');
      }, 200);
    }

    function copyPhone(text) {
      navigator.clipboard.writeText(text);
      const toast = document.getElementById('toast');
      toast.classList.add('active');

      setTimeout(() => {
        toast.classList.remove('active');
      }, 2500);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
