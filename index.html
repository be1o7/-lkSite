<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berkay Yılmaz — Portfolyo</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- BACKGROUND -->
  <div id="ambient-glow" class="mouse-glow"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- MAIN -->
  <main class="container">

    <!-- HERO -->
    <header class="hero">

      <div class="profile-wrapper">
        <div class="profile-glow"></div>
        <img src="manifestyaa.JPEG" class="profile-img" alt="Berkay Yılmaz">
      </div>

      <div class="status-badge">
        <span class="status-dot"></span>
        Geliştirici & Bilişim Öğrencisi
      </div>

      <h1 class="title">Berkay Yılmaz</h1>
      <p class="subtitle">
        Donanım, yazılım ve yapay zeka araçlarıyla dijital deneyimler üretiyorum.
      </p>

    </header>

    <!-- CARDS -->
    <section class="grid">

      <button class="card" onclick="openModal('about')">
        <div class="card-left">
          <div class="icon-box"><i data-lucide="user"></i></div>
          <div>
            <h2>Hakkımda</h2>
            <p>Vizyonum ve hedeflerim</p>
          </div>
        </div>
        <i data-lucide="chevron-right"></i>
      </button>

      <button class="card" onclick="openModal('skills')">
        <div class="card-left">
          <div class="icon-box"><i data-lucide="cpu"></i></div>
          <div>
            <h2>Yetenekler</h2>
            <p>Yazılım & AI</p>
          </div>
        </div>
        <i data-lucide="chevron-right"></i>
      </button>

      <button class="card" onclick="openModal('school')">
        <div class="card-left">
          <div class="icon-box"><i data-lucide="graduation-cap"></i></div>
          <div>
            <h2>Eğitim</h2>
            <p>11. sınıf bilişim</p>
          </div>
        </div>
        <i data-lucide="chevron-right"></i>
      </button>

      <button class="card" onclick="openModal('contact')">
        <div class="card-left">
          <div class="icon-box"><i data-lucide="phone"></i></div>
          <div>
            <h2>İletişim</h2>
            <p>Bağlantı kur</p>
          </div>
        </div>
        <i data-lucide="chevron-right"></i>
      </button>

    </section>

  </main>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">

      <button class="close-btn" onclick="closeModal()">
        <i data-lucide="x"></i>
      </button>

      <div class="modal-header">
        <div id="modal-icon-wrapper"></div>
        <h2 id="modal-title"></h2>
      </div>

      <div id="modal-body"></div>

    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    lucide.createIcons();

    const contentData = {
      about: {
        title: "Hakkımda",
        icon: "user",
        body: `<p>Ben Berkay Yılmaz. Yazılım ve donanım ile ilgileniyorum.</p>`
      },
      skills: {
        title: "Yetenekler",
        icon: "cpu",
        body: `<p>JavaScript, HTML, CSS, AI araçları ve PC sistemleri.</p>`
      },
      school: {
        title: "Eğitim",
        icon: "graduation-cap",
        body: `<p>11. sınıf Bilişim Teknolojileri öğrencisiyim.</p>`
      },
      contact: {
        title: "İletişim",
        icon: "phone",
        body: `<p>Telefon / WhatsApp üzerinden ulaşabilirsiniz.</p>`
      }
    };

    // mouse glow
    window.addEventListener("mousemove", (e) => {
      const glow = document.getElementById("ambient-glow");
      glow.style.setProperty("--mouse-x", e.clientX + "px");
      glow.style.setProperty("--mouse-y", e.clientY + "px");
      glow.style.opacity = "1";
    });

    function openModal(id) {
      const data = contentData[id];

      document.getElementById("modal-title").innerText = data.title;
      document.getElementById("modal-body").innerHTML = data.body;

      document.getElementById("modal-icon-wrapper").innerHTML =
        `<i data-lucide="${data.icon}"></i>`;

      document.getElementById("modal-overlay").classList.add("active");

      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById("modal-overlay").classList.remove("active");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  </script>

</body>
</html>
